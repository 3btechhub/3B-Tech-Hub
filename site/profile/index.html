<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>My Account | 3B TECH HUB</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script type="module" src="../assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="3B TECH HUB home"><span class="brand-mark">3B</span></a>
    <button class="menu-trigger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-menu" id="site-menu" aria-label="Site menu" hidden>
      <a href="../" data-label="home">Home</a>
      <a href="../login/" data-label="login">Login</a>
      <a href="../profile/" data-label="profile" id="profile-menu-link" hidden>Profile</a>
      <div class="menu-tools">
        <button class="menu-tool" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Dark / Light">☾</button>
        <button class="menu-tool" id="language-toggle" type="button" aria-label="Change language" title="Language">◎ <span id="language-code">EN</span></button>
      </div>
    </nav>
  </header>
  <main class="auth-main">
    <a class="back-link" href="../">← Home</a>
    <section id="profile-card" class="auth-form">
      <h1>My account</h1>
      <p id="profile-email" class="muted">Checking your session…</p>
      <p id="profile-message" class="auth-message" role="status" aria-live="polite"></p>
      <button id="sign-out" type="button">Sign out</button>
    </section>
  </main>
  <footer class="site-footer"><span>3B TECH HUB</span><a href="../login/" data-label="accountLogin">Account login</a></footer>
</body>
</html>
