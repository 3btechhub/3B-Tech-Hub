<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>My Account | 3B TECH HUB</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script defer src="../assets/menu.js"></script>
  <script type="module" src="../assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="3B TECH HUB home"><span class="brand-mark">3B</span></a>
    <button class="menu-trigger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-menu" id="site-menu" aria-label="Site menu" hidden>
      <a class="menu-link" href="../" data-label="home">Home</a>
      <a class="menu-link" href="../profile/" data-label="profile" id="profile-menu-link" hidden>Profile</a>
      <a class="menu-link" href="../services/" data-label="services">Services</a>
      <a class="menu-link" href="../login/" data-label="login" id="login-menu-link">Login</a>
      <button class="menu-link" type="button" data-label="logout" id="logout-menu-link" hidden>Logout</button>
      <a class="menu-link" href="../dashboard/" data-label="dashboard" id="dashboard-menu-link" hidden>Dashboard</a>
      <div class="menu-tools">
        <button class="menu-tool" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Dark / Light">☾</button>
        <button class="menu-tool" id="language-toggle" type="button" aria-label="Change language" title="Language"><span id="language-code">EN</span></button>
      </div>
    </nav>
  </header>
  <main class="auth-main">
    <section id="profile-card" class="profile-form">
      <div class="profile-row"><span id="profile-name">Loading…</span></div>
      <div class="profile-row"><span id="profile-email">Loading…</span></div>
      <div class="profile-row"><span id="profile-phone">Phone Number</span></div>
      <button class="profile-edit" id="profile-edit-toggle" type="button">Edit Profile</button>
      <form class="profile-edit-form" id="profile-edit-form" hidden>
        <label>Name<input name="name" type="text" maxlength="80" placeholder="Name" aria-label="Name" required></label>
        <label>Email<input name="email" type="email" maxlength="254" placeholder="Email" aria-label="Email" required></label>
        <label>Phone Number<input name="phone" type="tel" maxlength="24" placeholder="Phone Number" aria-label="Phone Number"></label>
        <fieldset class="profile-password-fields">
          <legend>Change Password</legend>
          <input name="currentPassword" type="password" autocomplete="current-password" placeholder="Current Password (only when changing password)" aria-label="Current Password">
          <input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" placeholder="New Password (leave blank to keep current)" aria-label="New Password">
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" placeholder="Confirm New Password" aria-label="Confirm New Password">
        </fieldset>
        <div class="profile-form-actions"><button type="submit">Save</button><button type="button" class="profile-cancel" id="profile-edit-cancel">Cancel</button></div>
      </form>
      <p id="profile-message" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="site-footer"><span>© 2026 3B TECH HUB. All rights reserved.</span></footer>
</body>
</html>
