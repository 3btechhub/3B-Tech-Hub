<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>My Account | 3B TECH HUB</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/country-router.js"></script>
  <script defer src="../assets/menu.js"></script>
  <script type="module" src="../assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="3B TECH HUB home"><span class="brand-mark">3B</span><span class="brand-title">3B TECH HUB</span></a>
    <button class="menu-trigger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-menu" id="site-menu" aria-label="Site menu" hidden><div class="menu-section menu-primary"><a class="menu-link" href="../" id="home-menu-link" data-label="home">Home</a><a class="menu-link" href="../profile/" id="profile-menu-link" data-label="profile" hidden>Profile</a><a class="menu-link" href="../account/" id="login-menu-link" data-label="login">Account</a><button class="menu-link" type="button" id="logout-menu-link" data-label="logout" hidden>Logout</button></div><div class="menu-divider" role="separator"></div><div class="menu-tools"><button class="menu-tool theme-tool" id="theme-toggle" type="button" aria-label="Switch theme"><span>Dark/Light:</span> <span class="theme-icon" aria-hidden="true">☾</span></button><label class="visually-hidden" for="language-select">Select language</label><select class="menu-tool" id="language-select" aria-label="Language"><option value="en">Language: English</option><option value="bn">Language: Bengali</option><option value="ar">Language: Arabic</option></select><label class="visually-hidden" for="region-select">Select country</label><select class="menu-tool" id="region-select" aria-label="Country"><option value="bd">Country: Bangladesh</option><option value="ksa">Country: Saudi Arabia</option><option value="global">Country: Global</option></select></div><div class="menu-divider" role="separator"></div><div class="menu-section menu-secondary"><a class="menu-link" href="../dashboard/" id="dashboard-menu-link" data-label="dashboard" hidden>Dashboard</a></div></nav>
  </header>
  <main class="auth-main">
    <section id="profile-card" class="profile-form">
      <form class="profile-inline-form" id="profile-edit-form">
        <div class="profile-row">
          <strong>Name</strong>
          <span class="profile-value" id="profile-name" data-profile-field="name" contenteditable="false" role="textbox" aria-label="Name">Loading…</span>
          <button class="profile-inline-edit" type="button" data-edit-field="name">Edit</button>
        </div>
        <div class="profile-row">
          <strong>Email</strong>
          <span class="profile-value" id="profile-email" data-profile-field="email" contenteditable="false" role="textbox" aria-label="Email">Loading…</span>
          <button class="profile-inline-edit" type="button" data-edit-field="email">Edit</button>
        </div>
        <div class="profile-row">
          <strong>Phone Number</strong>
          <span class="profile-value" id="profile-phone" data-profile-field="phone" contenteditable="false" role="textbox" aria-label="Phone Number">Loading…</span>
          <button class="profile-inline-edit" type="button" data-edit-field="phone">Edit</button>
        </div>
        <div class="profile-row">
          <strong>Password</strong>
          <span class="profile-value" aria-label="Password is hidden">••••••••</span>
          <button class="profile-inline-edit" id="profile-password-edit" type="button">Edit</button>
        </div>
        <fieldset class="profile-password-fields" id="profile-password-fields" hidden>
          <legend>Change Password</legend>
          <input name="currentPassword" type="password" autocomplete="current-password" placeholder="Current Password" aria-label="Current Password">
          <input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" placeholder="New Password" aria-label="New Password">
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" placeholder="Confirm New Password" aria-label="Confirm New Password">
        </fieldset>
        <button id="profile-save" type="submit" hidden aria-hidden="true" tabindex="-1"></button>
      </form>
      <p id="profile-message" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="site-footer"><span>© 2026 3B TECH HUB. All rights reserved.</span></footer>
</body>
</html>
