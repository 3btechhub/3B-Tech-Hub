<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Login | 3B TECH HUB</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script defer src="../assets/menu.js"></script>
  <script type="module" src="../assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="3B TECH HUB home"><span class="brand-mark">3B</span></a>
    <button class="menu-trigger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-menu" id="site-menu" aria-label="Site menu" hidden>
      <a class="menu-link" href="../" data-label="home">Home</a>
      <a class="menu-link" href="../profile/" data-label="profile" id="profile-menu-link" hidden>Profile</a>
      <a class="menu-link" href="../services/" data-label="services">Services</a>
      <a class="menu-link" href="../login/" data-label="login" id="login-menu-link">Login</a>
      <button class="menu-link" type="button" data-label="logout" id="logout-menu-link" hidden>Logout</button>
      <a class="menu-link" href="../dashboard/" data-label="dashboard" id="dashboard-menu-link" hidden>Dashboard</a>
      <div class="menu-tools">
        <button class="menu-tool" id="language-toggle" type="button" aria-label="Change language" title="Language"><span id="language-code">EN</span></button>
        <button class="menu-tool" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Dark / Light">☾</button>
      </div>
    </nav>
  </header>
  <main class="auth-main">
    <form id="auth-form" class="auth-form">
      <label class="visually-hidden" for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Email" maxlength="254" required>
      <label class="visually-hidden" for="otp">Verification code</label>
      <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification Code" minlength="6" maxlength="8" pattern="[0-9]{6,8}" hidden>
      <label class="visually-hidden" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" minlength="8" maxlength="256" required>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
      <button id="auth-submit" type="submit">Login</button>
      <div class="auth-links">
        <button id="forgot-password" class="text-button" type="button">Forgot password?</button>
        <button id="toggle-signup" class="text-button" type="button">Create account</button>
      </div>
    </form>
  </main>
  <footer class="site-footer"><span>© 2026 3B TECH HUB. All rights reserved.</span></footer>
</body>
</html>
