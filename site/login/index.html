<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Login | 3B TECH HUB</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script type="module" src="../assets/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../" aria-label="3B TECH HUB home"><span class="brand-mark">3B</span></a>
    <button class="menu-trigger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-menu" id="site-menu" aria-label="Site menu" hidden>
      <a href="../">Home</a>
      <a href="../login/">Login</a>
      <a href="../profile/">Profile</a>
    </nav>
  </header>
  <main class="auth-main">
    <a class="back-link" href="../">← Home</a>
    <form id="auth-form" class="auth-form">
      <h1 id="auth-title">Login</h1>
      <p id="auth-description" class="muted">Sign in with your email address and password.</p>
      <label class="visually-hidden" for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" maxlength="254" required>
      <label class="visually-hidden" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" maxlength="256" required>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
      <button id="auth-submit" type="submit">Login</button>
      <div class="auth-links">
        <button id="forgot-password" class="text-button" type="button">Forgot password?</button>
        <button id="toggle-signup" class="text-button" type="button">Create account</button>
      </div>
    </form>
  </main>
  <footer class="site-footer"><span>3B TECH HUB</span><a href="./">Account login</a></footer>
</body>
</html>
