name: Deploy GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website files and regression tests
        run: |
          test -s site/index.html
          test -s site/home/index.html
          test -s site/account/index.html
          test -s site/profile/index.html
          test -s site/dashboard/index.html
          test -s site/assets/style.css
          test -s site/assets/app.js
          test -s site/404.html
          npm run validate
          grep -q "3B TECH HUB" site/index.html
          grep -Fq '["home","account","profile","dashboard"].includes(first)' site/assets/site-router.js
          grep -q 'if (path === BASE.slice(0, -1) || path === BASE)' site/assets/site-router.js
          ! grep -q 'class="home-main' site/index.html
          ! test -d site/services
          ! test -d site/products
          ! test -d site/workshop
          ! test -d site/technicians
          ! grep -R -E "country-router|language-select|region-select|ipwho\\.is|preferred_locale|countryContextReady" site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}