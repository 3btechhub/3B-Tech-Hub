name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "migration/**"]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required website files
        run: |
          test -s site/index.html
          test -s site/home/index.html
          test -s site/account/index.html
          test -s site/profile/index.html
          test -s site/dashboard/index.html
          test -s site/assets/style.css
          test -s site/assets/app.js
          test -s site/404.html
      - name: Validate JavaScript syntax and regression tests
        run: npm run validate
      - name: Validate static routes and required branding
        run: |
          grep -q "3B TECH HUB" site/index.html
          grep -q 'if (path === BASE.slice(0, -1) || path === BASE)' site/assets/site-router.js
          grep -Fq 'first === "edit-profile"' site/assets/site-router.js
          ! grep -q 'class="home-main' site/index.html
          ! test -d site/services
          ! test -d site/products
          ! test -d site/workshop
          ! test -d site/technicians
          grep -q "signInWithPassword" site/assets/app.js
          grep -q "resetPasswordForEmail" site/assets/app.js
          ! grep -R -E "SUPABASE_SECRET_KEY|service_role" site
          ! grep -R -E "country-router|region-select|ipwho\\.is|preferred_locale|countryContextReady" site