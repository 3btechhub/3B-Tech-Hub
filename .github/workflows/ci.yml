name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "migration/**"]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required website files
        run: |
          test -s site/index.html
          test -s site/login/index.html
          test -s site/profile/index.html
          test -s site/dashboard/index.html
          test -s site/assets/style.css
          test -s site/assets/app.js
          test -s site/404.html
      - name: Validate JavaScript syntax
        run: node --input-type=module --check < site/assets/app.js
      - name: Run regression and syntax checks
        run: npm run validate
      - name: Validate static routes and required branding
        run: |
          grep -q "3B TECH HUB" site/index.html
          grep -q "signInWithPassword" site/assets/app.js
          grep -q "resetPasswordForEmail" site/assets/app.js
          ! grep -R -E "SUPABASE_SECRET_KEY|service_role" site
